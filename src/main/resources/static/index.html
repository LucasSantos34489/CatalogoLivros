<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de livros</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap');

:root {
  --tinta: #0b0f1a;
  --azul: #1f3fbf;
  --azul-escuro: #12286e;
  --azul-claro: #dbe6ff;
  --linha: #d9dfec;
  --suave: #5a6278;
  --erro: #c4281c;
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #ffffff;
  color: var(--tinta);
  font-family: var(--sans);
  line-height: 1.5;
}

.pagina {
  display: grid;
  grid-template-columns: 380px 1fr;
  min-height: 100vh;
}

/* Coluna do cadastro */
.lateral {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  overflow-y: auto;
  padding: 48px 40px;
  background: var(--azul-claro);
  border-right: 2px solid var(--tinta);
}

.lateral h1 {
  margin: 0 0 12px;
  font-family: var(--serif);
  font-weight: 800;
  font-size: 46px;
  line-height: 1.02;
  letter-spacing: -0.02em;
  color: var(--azul-escuro);
}

.lateral .intro { margin: 0 0 36px; color: var(--azul-escuro); font-size: 16px; }

.lateral h2 {
  margin: 0 0 18px;
  font-family: var(--serif);
  font-weight: 600;
  font-size: 22px;
}

.campo { margin-bottom: 18px; }
.linha-dupla { display: grid; grid-template-columns: 1fr 110px; gap: 16px; }

label { display: block; margin-bottom: 4px; font-size: 14px; font-weight: 700; }

input, textarea {
  width: 100%;
  padding: 8px 0;
  font: 16px var(--sans);
  color: var(--tinta);
  background: transparent;
  border: 0;
  border-bottom: 2px solid var(--tinta);
  border-radius: 0;
  outline: none;
}

textarea { resize: vertical; min-height: 84px; }
input::placeholder, textarea::placeholder { color: #6f7a99; }
input:focus, textarea:focus { border-bottom-color: var(--azul); box-shadow: 0 2px 0 var(--azul); }

button {
  font: 700 16px var(--sans);
  cursor: pointer;
  border-radius: 4px;
  transition: background .15s, transform .1s;
}

.btn-principal {
  width: 100%;
  margin-top: 8px;
  padding: 14px 20px;
  color: #fff;
  background: var(--tinta);
  border: 2px solid var(--tinta);
}

.btn-principal:hover { background: var(--azul); border-color: var(--azul); }
.btn-principal:active { transform: translateY(1px); }
.btn-principal:disabled { opacity: .55; cursor: wait; }

button:focus-visible { outline: 3px solid var(--azul); outline-offset: 3px; }

#mensagem { min-height: 24px; margin: 14px 0 0; font-weight: 700; font-size: 15px; }
.sucesso { color: var(--azul); }
.erro { color: var(--erro); }

/* Coluna da estante */
.estante { padding: 48px 56px 64px; min-width: 0; }

.estante-topo {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 36px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--tinta);
}

.estante-topo h2 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 800;
  font-size: 34px;
  letter-spacing: -0.01em;
}

.estante-topo .total { margin-left: 12px; font: 500 16px var(--sans); color: var(--suave); }

.btn-atualizar {
  padding: 9px 18px;
  color: var(--tinta);
  background: transparent;
  border: 2px solid var(--tinta);
}

.btn-atualizar:hover { background: var(--tinta); color: #fff; }

.lista-livros {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 44px 32px;
}

.livro { min-width: 0; }

.capa {
  position: relative;
  aspect-ratio: 2 / 3;
  margin-bottom: 18px;
  background: var(--azul-claro);
  border: 2px solid var(--tinta);
  border-radius: 2px 8px 8px 2px;
  box-shadow: 7px 8px 0 var(--azul);
  overflow: hidden;
}

.capa::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 12px;
  background: linear-gradient(90deg, var(--tinta) 0 5px, rgba(11,15,26,.18) 5px 7px, transparent 7px);
  z-index: 1;
}

.capa img { display: block; width: 100%; height: 100%; object-fit: cover; }

.capa-inicial {
  display: grid;
  place-items: center;
  height: 100%;
  padding-left: 12px;
  font-family: var(--serif);
  font-weight: 800;
  font-size: 88px;
  color: var(--azul);
}

.livro h3 {
  margin: 0 0 6px;
  font-family: var(--serif);
  font-weight: 600;
  font-size: 21px;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.genero {
  display: inline-block;
  margin-bottom: 10px;
  padding: 2px 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--azul-escuro);
  background: var(--azul-claro);
  border-radius: 99px;
}

.dados { margin: 0 0 10px; font-size: 14px; color: var(--suave); }
.dados div { display: flex; gap: 6px; }
.dados dt { font-weight: 700; color: var(--tinta); }
.dados dd { margin: 0; overflow-wrap: anywhere; }

.descricao {
  margin: 0;
  font-size: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.estado { grid-column: 1 / -1; margin: 0; color: var(--suave); font-size: 17px; }

@media (max-width: 900px) {
  .pagina { grid-template-columns: 1fr; }
  .lateral { position: static; height: auto; border-right: 0; border-bottom: 2px solid var(--tinta); padding: 32px 24px; }
  .estante { padding: 32px 24px 48px; }
  .lateral h1 { font-size: 38px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
  </style>
</head>
<body>
  <div class="pagina">

    <aside class="lateral">
      <h1>Catálogo de livros</h1>
      <p class="intro">Cadastre os livros que você leu, quer ler ou tem na estante.</p>

      <h2>Cadastrar novo livro</h2>
      <form id="formLivro">
        <div class="campo">
          <label for="nome">Nome do livro</label>
          <input type="text" id="nome" placeholder="Ex.: O Hobbit" required>
        </div>

        <div class="campo">
          <label for="genero">Gênero</label>
          <input type="text" id="genero" placeholder="Ex.: Fantasia" required>
        </div>

        <div class="linha-dupla campo">
          <div>
            <label for="plataforma">Plataforma</label>
            <input type="text" id="plataforma" placeholder="Físico, Kindle, PDF" required>
          </div>
          <div>
            <label for="anoLancamento">Ano</label>
            <input type="number" id="anoLancamento" placeholder="1937" min="1" max="2100" required>
          </div>
        </div>

        <div class="campo">
          <label for="imagem">URL da imagem de capa</label>
          <input type="url" id="imagem" placeholder="https://exemplo.com/capa.jpg">
        </div>

        <div class="campo">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" rows="3" placeholder="Conte um pouco sobre o livro"></textarea>
        </div>

        <button type="submit" id="btnCadastrar" class="btn-principal">Cadastrar livro</button>
        <p id="mensagem" role="status" aria-live="polite"></p>
      </form>
    </aside>

    <main class="estante">
      <div class="estante-topo">
        <h2>Livros cadastrados<span class="total" id="total"></span></h2>
        <button type="button" id="btnAtualizar" class="btn-atualizar">Atualizar</button>
      </div>
      <div id="listaLivros" class="lista-livros">
        <p class="estado">Carregando livros...</p>
      </div>
    </main>

  </div>

  <script>
// Rotas possíveis do seu LivroController. A página testa cada uma e usa a que responder.
// Se a sua for diferente, é só adicionar na lista.
const ROTAS = ["/livros", "/api/livros", "/livro", "/api/livro"];
let API_URL = ROTAS[0];

async function descobrirRota() {
  for (const rota of ROTAS) {
    try {
      const resposta = await fetch(rota);
      if (resposta.ok) {
        API_URL = rota;
        return;
      }
    } catch (erro) {
      // tenta a próxima rota
    }
  }
}

const formLivro = document.getElementById("formLivro");
const listaLivros = document.getElementById("listaLivros");
const mensagem = document.getElementById("mensagem");
const btnCadastrar = document.getElementById("btnCadastrar");
const total = document.getElementById("total");

let livrosCarregados = [];

function criarEstado(texto, classe) {
  const p = document.createElement("p");
  p.className = "estado" + (classe ? " " + classe : "");
  p.textContent = texto;
  return p;
}

function criarLinhaDado(rotulo, valor) {
  const linha = document.createElement("div");
  const dt = document.createElement("dt");
  dt.textContent = rotulo;
  const dd = document.createElement("dd");
  dd.textContent = valor ?? "-";
  linha.append(dt, dd);
  return linha;
}

function criarCapaInicial(nome) {
  const inicial = document.createElement("div");
  inicial.className = "capa-inicial";
  inicial.textContent = (nome || "?").trim().charAt(0).toUpperCase();
  return inicial;
}

function criarCard(livro) {
  const card = document.createElement("article");
  card.className = "livro";

  const capa = document.createElement("div");
  capa.className = "capa";

  if (livro.imagem) {
    const img = document.createElement("img");
    img.src = livro.imagem;
    img.alt = `Capa do livro ${livro.nome ?? ""}`;
    img.loading = "lazy";
    img.onerror = () => img.replaceWith(criarCapaInicial(livro.nome));
    capa.appendChild(img);
  } else {
    capa.appendChild(criarCapaInicial(livro.nome));
  }

  const titulo = document.createElement("h3");
  titulo.textContent = livro.nome ?? "Livro sem nome";

  const genero = document.createElement("span");
  genero.className = "genero";
  genero.textContent = livro.genero ?? "Sem gênero";

  const dados = document.createElement("dl");
  dados.className = "dados";
  dados.append(
    criarLinhaDado("Plataforma:", livro.plataforma),
    criarLinhaDado("Lançamento:", livro.anoLancamento)
  );

  const descricao = document.createElement("p");
  descricao.className = "descricao";
  descricao.textContent = livro.descricao || "Sem descrição cadastrada.";
  descricao.title = livro.descricao || "";

  card.append(capa, titulo, genero, dados, descricao);
  return card;
}

// GET: consulta os livros cadastrados na API.
async function listarLivros() {
  listaLivros.replaceChildren(criarEstado("Buscando livros na API..."));

  try {
    const resposta = await fetch(API_URL);

    if (!resposta.ok) {
      throw new Error(`Erro HTTP: ${resposta.status}`);
    }

    const livros = await resposta.json();
    livrosCarregados = Array.isArray(livros) ? livros : [];
    listaLivros.replaceChildren();
    total.textContent = livrosCarregados.length ? `(${livrosCarregados.length})` : "";

    if (livrosCarregados.length === 0) {
      listaLivros.appendChild(criarEstado("Nenhum livro cadastrado ainda. Use o formulário para adicionar o primeiro."));
      return;
    }

    livrosCarregados.forEach((livro) => listaLivros.appendChild(criarCard(livro)));
  } catch (erro) {
    console.error("Erro ao buscar livros:", erro);
    total.textContent = "";
    listaLivros.replaceChildren(
      criarEstado("Não foi possível carregar os livros. Verifique se a API está em execução.", "erro")
    );
  }
}

// POST: envia os dados do formulário para a API.
formLivro.addEventListener("submit", async (event) => {
  event.preventDefault();

  const livro = {
    // Sua entidade usa @Id sem @GeneratedValue, então o id é enviado aqui.
    // Se adicionar @GeneratedValue na entidade, pode remover esta linha.
    id: livrosCarregados.reduce((max, l) => Math.max(max, l.id || 0), 0) + 1,
    nome: document.getElementById("nome").value.trim(),
    genero: document.getElementById("genero").value.trim(),
    plataforma: document.getElementById("plataforma").value.trim(),
    anoLancamento: Number(document.getElementById("anoLancamento").value),
    descricao: document.getElementById("descricao").value.trim(),
    imagem: document.getElementById("imagem").value.trim()
  };

  mensagem.textContent = "Enviando cadastro...";
  mensagem.className = "";
  btnCadastrar.disabled = true;

  try {
    const resposta = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(livro)
    });

    if (!resposta.ok) {
      const detalhe = await resposta.text();
      throw new Error(detalhe || `Erro HTTP: ${resposta.status}`);
    }

    mensagem.textContent = "Livro cadastrado com sucesso!";
    mensagem.className = "sucesso";
    formLivro.reset();

    // Atualiza a tela para mostrar o livro recém-cadastrado.
    await listarLivros();
  } catch (erro) {
    console.error("Erro ao cadastrar livro:", erro);
    mensagem.textContent = "Não foi possível cadastrar. Verifique os dados e a API.";
    mensagem.className = "erro";
  } finally {
    btnCadastrar.disabled = false;
  }
});

// Botão para executar o GET novamente.
document.getElementById("btnAtualizar").addEventListener("click", listarLivros);

// Ao abrir a página, descobre a rota da API e busca os livros automaticamente.
descobrirRota().then(listarLivros);
  </script>
</body>
</html>
